# Regresní baterie protokolů — protocol-humor-tester.
# Rostoucí sada testovacích vstupů pro prompt v prompty/protokol.md.
# Každý vstup, který dřív odhalil problém, sem patří — ať se regrese chytí příště.
#
# Jak se používá: `sim/brana-cestiny.js` postaví vstup z `ctx`+`udalosti` PŘES
# `buildPromptInput()` (prototyp/src/llm/prompt-input.js) — stejnou funkci, kterou
# volá produkce — a aplikuje na něj aktuální systémový prompt z protokol.md
# (produkční model Claude Haiku 4.5 dle D55, klidně víc výstupů na vstup). Výstup
# se ověří proti `ocekavani`. Změna/změkčení/zamlčení výsledku mechaniky = KRITICKÉ,
# ne stylistická drobnost.
#
# ŘEZ v3 (2026-07-23): vstup je ve formátu v3 z protokol.md (SITUACE / PRAVIDLO RUNU /
# ZÁCHRANA / ROZDĚLENÍ / VÝSLEDEK MECHANIKY / NÁSLEDKY). Staré v2 casy
# (UZEL/OSOBY/KARTY) jsou dole v sekci ARCHIV a na prompt v0.3+ se NEaplikují.
#
# ŘEZ v0.4 (2026-08-01): vstupy doplněny o `PRAVIDLO RUNU`, `ZÁCHRANA` a
# `MAX DOSAŽITELNÉ`. Přibyla skupina KREATIVNÍ CASY, která testuje mandát invence
# (rule 5) a jeho pojistku (rule 4 — vymyšlený mechanický důsledek).
#
# ŘEZ v0.4.1 (2026-08-02): (a) znakový strop zvednut 800 → 900 ve všech `ocekavani`;
# (b) kredity v `vstup`ech srovnány se zapečeným enginem (HLADCE+LOOT +3, HLADCE +2 —
# `prototyp/src/engine/rules.js` `kredity`; dřívější +2/+1 byla próza z doby před
# kalibrací-1); (c) přibyl case `solo-bohate-nasledky-strop-delky`, který strop 900
# hlídá na nejhorším terénu. POZOR: kdyby se strop kdykoli vracel dolů, musí se
# překlopit VŠECHNY čtyři starší casy se znakovým limitem, ne jen nový.
#
# ŘEZ D55 (2026-08-02, A/B report technika/brana-cestiny-ab-2026-08-02.md, §Nula):
# VŠECH 13 v3 casů převedeno z ručně psaného `vstup` (string) na strukturované
# `ctx`+`udalosti` — TŘETÍ doložený nález, že ruční vstup byl vlídnější než to, co
# posílá `buildPromptInput()` v produkci (chybějící `důvod:` u slotů kromě
# gangster_auto_fail, jiné/žádné znění `PRAVIDLO RUNU`, žádný text lootu). Převod
# odhalil tři konkrétní místa, kde starý ruční vstup zobrazoval víc, než produkce
# kdy pošle:
#   1. `loot:` je v `buildPromptInput()` VŽDY „—" (engine nikde neloguje id
#      líznuté věci navíc — viz komentář ve funkci). Case
#      `hladky-pruchod-loot-brokovnice-v-lokaci` dřív žádal „zmínit loot (líznutou
#      věc)"; to je s aktuálním enginem TRVALE nesplnitelné, přepsáno na DIAGNOSTIKU
#      (stejná třída jako mrtvá pole ZÁCHRANA/MAX DOSAŽITELNÉ, §7 A/B reportu).
#   2. `PRAVIDLO RUNU` se v produkci objeví, jen když aspoň jeden SLOT TOHOTO UZLU
#      nese `duvod: stat_zrusen` (typicky hodnota zrušená pronásledovatelem) — ne
#      jen proto, že je pravidlo v běhu obecně platné. Dva casy
#      (`invence-selhany-slot-nesedici-vec`, `past-vymysleny-dusledek`) měly ručně
#      napsané „PRAVIDLO RUNU: hodnota se počítá jako 0…", ačkoli žádný ze čtyř
#      slotů stat „hodnota" vůbec nepoužívá — v produkci by uzel dostal „—". Řádek
#      odstraněn; jméno „agent Malone" zůstává v textu SITUACE jako scénická reálie.
#   3. Složení (`character_folded`) má v `buildPromptInput()` pevný tvar
#      „podezřelý X leží v autě (3. postih)" — bez prostoru pro doplňkovou fikci
#      typu „lehké zápisy smazány, těžký otřes mozku drží" (case
#      `zachrana-vytazena-vec-k-nicemu` ji dřív měl ručně dopsanou). Zkráceno na
#      produkční tvar.
# Sólo klauzule i skladba slotů/následků zůstaly beze změny — mění se jen TVAR
# vstupu, ne co case testuje. Obsahové nálezy z A/B reportu (kredity bez opory
# v rule 7; rozpor `popis`×`vstup` u `solo-jedna-osoba-ctyri-sloty`) tenhle řez
# VĚDOMĚ neřeší — patří samostatnému obsahovému kolu (protocol-humor-tester).
#
# POZOR na variantu mandátu: v0.4 je **plné B** — invence u KAŽDÉHO ze čtyř slotů,
# s nerovným rozpočtem (sedící věc pár slov, nesedící celý záměr). Zamítnutá
# alternativa B-lite (invence JEN u selhaných/nesedících) by měla opačná
# `ocekavani` u prošlých slotů — kdyby se prompt někdy vrátil k B-lite, musí se
# s ním překlopit i casy `hladky-pruchod-…`, `invence-selhany-slot-…`
# a `invence-nesmi-opsat-text-veci`.
#
# Schéma:
#   id:        kebab-case, unikátní
#   popis:     co case testuje a proč je rizikový
#   zdroj:     odkud pochází vstupní data (snapshot znění)
#   ctx:       { jmena, veci, situace, postihy, kredityPo } — stejný tvar, jaký
#              staví `llmCtxZObsahu()` v produkci. `jmena` je mapa hrac_id→celé
#              jméno; POŘADÍ klíčů určuje placeholdery A–D (Object.keys pořadí).
#              `veci`/`situace`/`postihy` jsou mapy id→(název | {nazev, text}).
#              `kredityPo` je nouzový zdroj řádku „kredity: …; konto n", když
#              uzel sám nenese `credit_flow` (žádná změna kreditů).
#   udalosti:  pole událostí JEDNOHO uzlu přesně ve tvaru, jaký loguje engine
#              (architektura.md §2.2 v3, `src/engine/events.js` EVENT.*) —
#              situation_revealed, slot_resolved (4×), band_resolved a volitelně
#              penalty_added / character_folded / credit_flow / zar_move / gamble.
#              `sim/brana-cestiny.js` je prožene `buildPromptInput()` — TOUTÉŽ
#              funkcí jako produkce — a výsledný text jde do modelu.
#   vstup:     VÝJIMKA — ruční text přesně ve formátu z protokol.md, jen pro
#              casy, které se ještě nepřevedly na `ctx`+`udalosti`. Log ho
#              vyznačí `[RUČNÍ VSTUP — VÝJIMKA]` (viz `sim/brana-cestiny.js`).
#              V TÉTO baterii žádný v3 case ruční `vstup` už nepoužívá.
#   ocekavani:
#     musi:    seznam vlastností, které protokol MUSÍ splnit
#     nesmi:   seznam vlastností, které protokol NESMÍ obsahovat

testy:
  # ---------- v3: jádro (rule 2 / rule 3 / rule 4) ----------
  - id: banan-utok-selhal
    popis: >
      Rule 4 + jádro rule 3. Banánový kanón (improvizace 4, útok 2) commitnut do
      útočné role „Kdyby vyváděl" (práh 3) → selhání. Text věci láká rozehrát ho
      jako zbraň; model to SMÍ komicky rozehrát (leštěný banán jako pistole), ale
      výsledek slotu zůstává selhání. Past: model povýší komickou fikci na úspěch,
      nebo naopak komiku zamlčí. Zároveň selhání „Zapřáhnout" (Zlaté hodinky,
      nástroj 1). Pásmo 2/4 S NÁSLEDKY → 1 lehký postih, žádná ztráta beden.
      Bez gapu (MAX 2/4) — lépe to s těmito věcmi nešlo.
    zdroj: "obsah/situace.yaml farmar-brod + veci.yaml (2026-07-23)"
    udalosti:
      - type: situation_revealed
        nodeIndex: 0
        situace_id: farmar-brod
        typ: npc
        sloty:
          - {slot_index: 0, role: "Zaplatit za vytažení"}
          - {slot_index: 1, role: "Nezvednout hlas"}
          - {slot_index: 2, role: "Zapřáhnout a táhnout"}
          - {slot_index: 3, role: "Kdyby začal vyvádět"}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 0, karta_id: balik-bankovek, hrac_id: p1, stat: hodnota, stat_hodnota: 5, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: true, duvod: proslo}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 1, karta_id: otrleny-vyraz, hrac_id: p2, stat: obrana, stat_hodnota: 4, prah: 2, typ_prahu: jednostat, viditelnost: viditelna, zasah: true, duvod: proslo}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 2, karta_id: zlate-hodinky, hrac_id: p3, stat: nastroj, stat_hodnota: 1, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: false, duvod: nizky_stat}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 3, karta_id: bananovy-kanon, hrac_id: p4, stat: utok, stat_hodnota: 2, prah: 3, typ_prahu: jednostat, viditelnost: skryta, zasah: false, duvod: nizky_stat}
      - {type: band_resolved, nodeIndex: 0, pasmo: "2/4_S_NASLEDKY", zasahy: 2, max_achievable_zasahy: 2, naklad_ztrata: 0, zbyva_beden: 6}
      - {type: penalty_added, nodeIndex: 0, hrac_id: p4, postih_id: narazene-rameno, tier: lehky}
    ctx:
      jmena: {p1: "Vincenc Bartoš", p2: "Frank Kowalski", p3: "Eddie Klein", p4: "Sam Rossi"}
      veci:
        balik-bankovek: "Balík bankovek"
        otrleny-vyraz: "Otrlený výraz"
        zlate-hodinky: "Zlaté hodinky"
        bananovy-kanon: "Banánový kanón"
      situace:
        farmar-brod: {nazev: "Farmář v brodě", text: "Kola zapadla doprostřed brodu a na břehu čeká farmář s vidlemi."}
      postihy:
        narazene-rameno: {nazev: "Naražené rameno", text: "Do kapes sahá pomaleji."}
      kredityPo: 8
    ocekavani:
      musi:
        - "zapsat, že slot „Zapřáhnout“ i slot „Kdyby vyváděl“ (banán) SELHALY"
        - "zapsat postih podezřelého D (naražené rameno) jako fikci"
        - "placeholdery „podezřelý A/B/C/D“, 3–5 vět, ≤900 znaků, suchý úřední tón, 3. osoba"
      nesmi:
        - "tvrdit, že banán / útočná role uspěl(a) — komická fikce NEMĚNÍ výsledek slotu (KRITICKÉ)"
        - "tvrdit ztrátu jakékoli bedny (náklad zůstává 6) ani pohyb Žáru/šerifa"
        - "vinit posádku ze špatného rozdělení — MAX DOSAŽITELNÉ je rovné dosaženému (2/4)"
        - "vymyslet vlastní jméno podezřelého místo placeholderu"
        - "vtipkovat explicitně, emoji, hovorovost, anachronismus"

  - id: brokovnice-auto-fail-viditelna
    popis: >
      GANGSTER auto-fail ve viditelné roli NPC. Dědečkova brokovnice (útok 5)
      v roli „Postavit se jim" (útok, viditelná, npc) → selhání BEZ ohledu na
      staty (šerif/rival zbraň uvidí). Nejzáludnější past: model vidí útok 5 ≥
      práh a napíše zásah — to je změna výsledku. Zároveň banán ve skryté útočné
      roli také selhal (útok 2). Pásmo PRŮŠVIH ≤1/4 → těžký postih, ztráta beden,
      pohyb Žáru (i z hlučnosti GANGSTER). MAX 2/4 = velký gap: brokovnice patřila
      do SKRYTÉ role, kde by prošla.
    zdroj: "obsah/situace.yaml rival-prepad + veci.yaml + stitky.yaml GANGSTER (2026-07-23)"
    udalosti:
      - type: situation_revealed
        nodeIndex: 0
        situace_id: rival-prepad
        typ: npc
        sloty:
          - {slot_index: 0, role: "Postavit se jim"}
          - {slot_index: 1, role: "Ustát nápor"}
          - {slot_index: 2, role: "Vyklouznout stranou"}
          - {slot_index: 3, role: "Tasit včas a první"}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 0, karta_id: dedeckova-brokovnice, hrac_id: p1, stat: utok, stat_hodnota: 5, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: false, duvod: gangster_auto_fail}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 1, karta_id: zpev-opilce, hrac_id: p2, stat: obrana, stat_hodnota: 2, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: false, duvod: nizky_stat}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 2, karta_id: pacidlo, hrac_id: p3, stat: improvizace, stat_hodnota: 1, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: false, duvod: nizky_stat}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 3, karta_id: bananovy-kanon, hrac_id: p4, stat: utok, stat_hodnota: 2, prah: 3, typ_prahu: jednostat, viditelnost: skryta, zasah: false, duvod: nizky_stat}
      - {type: band_resolved, nodeIndex: 0, pasmo: "≤1/4_PRUSVIH", zasahy: 0, max_achievable_zasahy: 2, naklad_ztrata: 1, zbyva_beden: 5}
      - {type: penalty_added, nodeIndex: 0, hrac_id: p1, postih_id: zlomene-zebro, tier: tezky}
      - {type: zar_move, nodeIndex: 0, delta: 1, duvod: prusvih, prah_prekrocen: null}
      - {type: zar_move, nodeIndex: 0, delta: 1, duvod: hlucne_GANGSTER, prah_prekrocen: null}
    ctx:
      jmena: {p1: "Vincenc Bartoš", p2: "Frank Kowalski", p3: "Eddie Klein", p4: "Sam Rossi"}
      veci:
        dedeckova-brokovnice: "Dědečkova brokovnice"
        zpev-opilce: "Zpěv opilce"
        pacidlo: "Páčidlo"
        bananovy-kanon: "Banánový kanón"
      situace:
        rival-prepad: {nazev: "Přepadení rivalů", text: "Napříč silnicí stály vozy rivalů a chlapi si plivali do dlaní."}
      postihy:
        zlomene-zebro: {nazev: "Zlomené žebro", text: "Sahá po míň věcech, drží do vyléčení."}
      kredityPo: 8
    ocekavani:
      musi:
        - "zapsat, že role „Postavit se jim“ (brokovnice) SELHALA — smí uvést, že zbraň byla na očích"
        - "zapsat těžký postih podezřelého A, ztrátu 1 bedny (náklad 5) a pohyb šerifa/Žáru s důvodem"
      nesmi:
        - "tvrdit, že brokovnice / útočná role uspěla kvůli vysokému útoku (KRITICKÉ — auto-fail se nemění)"
        - "tvrdit jiný počet ztracených beden než 1, nebo že se Žár/šerif nehnul"
        - "tvrdit, že to nešlo lépe — MAX DOSAŽITELNÉ (2/4) je nad dosaženým (0/4)"
        - "vymyslet vlastní jméno podezřelého místo placeholderu"
        - "vtipkovat explicitně, emoji, hovorovost, anachronismus"

  - id: hladky-pruchod-loot-brokovnice-v-lokaci
    popis: >
      Baseline 4/4 HLADCE+LOOT bez postihů. Zároveň kontrast k brokovnici-auto-fail:
      TÁŽ Dědečkova brokovnice ve skryté roli v LOKACI projde (eso_v_lokaci —
      nikdo ji nevidí). Riziko: model dodá dramatičnost/následky, které nepadly,
      nebo naopak zapíše brokovnici jako selhání ze setrvačnosti. Musí zmínit
      přírůstek kreditů (+3); loot samotný NEJDE testovat jako musí-položka (viz
      DIAGNOSTIKA níže — `buildPromptInput()` posílá `loot: —` vždy, engine
      nikdy neloguje id líznuté věci). Od v0.4 také **test ROZPOČTU mandátu na
      nejhorším terénu**: všechny čtyři sloty prošly a tři ze čtyř věcí k roli
      sedí, takže plné B tu má nejmíň materiálu a nejvíc chuti vyrobit vatu.
      Rule 5 invenci žádá i tady, ale „pár slov" — hlídá se znakový strop,
      neopakování figury a to, že invence neopisuje text věci.
    zdroj: "obsah/situace.yaml farmar-stodola + veci.yaml + stitky.yaml (2026-07-23)"
    udalosti:
      - type: situation_revealed
        nodeIndex: 0
        situace_id: statkarova-stodola
        typ: lokace
        sloty:
          - {slot_index: 0, role: "Utišit psy"}
          - {slot_index: 1, role: "Zaklínit vrata"}
          - {slot_index: 2, role: "Schovat bednu do sena"}
          - {slot_index: 3, role: "Nedýchat, když jde kolem"}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 0, karta_id: falesny-odznak, hrac_id: p1, stat: improvizace, stat_hodnota: 5, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: true, duvod: proslo}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 1, karta_id: stary-kompas, hrac_id: p2, stat: [nastroj, improvizace], stat_hodnota: [3, 3], prah: 2, typ_prahu: kombi_oba, viditelnost: viditelna, zasah: true, duvod: proslo}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 2, karta_id: svarecka, hrac_id: p3, stat: nastroj, stat_hodnota: 5, prah: 3, typ_prahu: jednostat, viditelnost: viditelna, zasah: true, duvod: proslo}
      - {type: slot_resolved, nodeIndex: 0, slot_index: 3, karta_id: dedeckova-brokovnice, hrac_id: p4, stat: obrana, stat_hodnota: 2, prah: 2, typ_prahu: jednostat, viditelnost: skryta, zasah: true, duvod: proslo}
      - {type: band_resolved, nodeIndex: 0, pasmo: "4/4_HLADCE_LOOT", zasahy: 4, max_achievable_zasahy: 4, naklad_ztrata: 0, zbyva_beden: 6}
      - {type: credit_flow, nodeIndex: 0, delta: 3, duvod: hladce_loot, zustatek: 11}
    ctx:
      jmena: {p1: "Vincenc Bartoš", p2: "Frank Kowalski", p3: "Eddie Klein", p4: "Sam Rossi"}
      veci:
        falesny-odznak: "Falešný odznak"
        stary-kompas: "Starý kompas"
        svarecka: "Svářečka"
        dedeckova-brokovnice: "Dědečkova brokovnice"
      situace:
        statkarova-stodola: {nazev: "Statkářova stodola", text: "Ve stodole to páchne senem a psi u vrat nespí; statkář obchází s lucernou."}
      postihy: {}
    ocekavani:
      musi:
        - "zapsat hladký průchod všech čtyř rolí bez potíží"
        - "zmínit přírůstek kreditů (+3)"
        - "dodržet znakový strop ≤900 zn. a 3–5 vět i při čtyřech licencovaných invencích"
        - "DIAGNOSTIKA (neblokující, D55): vstup nese `loot: —` (buildPromptInput() nikdy nejmenuje líznutou věc — engine ji neloguje, viz A/B report §5 bod 4 a §7). Nezapočítávat jako selhání, když protokol loot vůbec nezmíní — to je SPRÁVNĚ; tahle položka jen hlídá, že si model loot nevymyslí (viz nesmí níže)."
      nesmi:
        - "tvrdit jakýkoli postih, ztrátu bedny, zranění ani pohyb Žáru/šerifa (nic z toho nepadlo)"
        - "zapsat brokovnici jako selhání — ve skryté roli v lokaci prošla"
        - "vymyslet KONKRÉTNÍ líznutou věc navíc — vstup žádnou nejmenuje (KRITICKÉ, D55 nález)"
        - "opsat u sedících věcí text karty místo záměru (svářečka „spojí, co se rozpadlo“, odznak „zamáváš jím zdálky“) — invence musí přidat ZÁMĚR, ne parafrázi"
        - "použít u dvou a více slotů tutéž větnou vazbu nebo figuru (rule 6; vzorec B5′)"
        - "vymyslet vlastní jméno podezřelého místo placeholderu"
        - "vtipkovat explicitně, emoji, hovorovost, anachronismus"

  - id: slozeni-lezi-v-aute
    popis: >
      Složení (3. postih → osoba „leží v autě"). Nahrazuje v2 case hlas-z-auta.
      Podezřelý C dostane 3. postih a je složen. Past: model buď složení zamlčí,
      nebo naopak nechá složeného aktivně jednat nad rámec „leží v autě". Musí
      zapsat, že C je vyřazen a leží v autě; nesmí mu přisoudit další akci ve slotech.
    zdroj: "obsah/situace.yaml mesto-ulicka + postihy.yaml + prototyp-mvp.md §složení (2026-07-23)"
    udalosti:
      - type: situation_revealed
        nodeIndex: 0
        situace_id: slepa-ulicka
        typ: npc
        sloty:
          - {slot_index: 0, role: "Držet nervy"}
          - {slot_index: 1, role: "Zamluvit to"}
