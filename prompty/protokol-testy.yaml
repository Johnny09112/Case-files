        Kdyby čenichal dál: zásah (práh 4; „Uříznutá hlaveň" mělo útok 4; důvod: zbraň ve skryté roli projde)
      NÁSLEDKY:
        postihy: podezřelý A — „Ochrnutá ruka" (těžký, ruka visí jak cizí a zbraň v ní neudrží; drží do vyléčení)
        složení: —
