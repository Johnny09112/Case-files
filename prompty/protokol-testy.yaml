        - "uzavřít závorkou osobní poznámky vyšetřovatele — rule 8 od v0.4.1 určuje POŘADÍ ŠKRTÁNÍ (u stropu se škrtá kulisa, ne poznámka a ne následek), takže je to vynutitelné, ne jen přání testéra"
        - "psát o JEDNÉ osobě, která zvládala čtyři úlohy po sobě — označení „podezřelý A“ nejvýš dvakrát, dál „jmenovaný“/„týž“"
