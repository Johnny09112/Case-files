  # ---------- v0.4.1: STROP DÉLKY ----------
  - id: solo-bohate-nasledky-strop-delky
    popis: >
      STROP DÉLKY (v0.4.1, rule 1: 900 zn.). Nejhorší terén pro rozpočet: SÓLO uzel,
      kde na protokol naráz doléhá VŠECHNO — čtyři obhajoby pokusu (rule 5), sólo
      klauzule (rule 2), vsuvka o záchraně, gap proti MAX DOSAŽITELNÉMU, těžký
      postih, ztráta bedny, pohyb Žáru s důvodem A závorka vyšetřovatele (rule 8).
      Přesně na tomhle profilu se strop 800 ukázal jako těsný a model obětoval jako
      první závorku — jedinou nepovinnou položku, a přitom podpisovou figuru celého
      protokolu. Case hlídá obojí najednou: že se text vejde do 900 znaků A že se
      z něj přitom nevytratí ani jeden následek ani ta závorka. Když se sem prompt
      nevejde, NENÍ řešením škrtnout následek — to je porušení rule 3/7.
      Vedlejší past: záchrana tu vytáhla jedinou věc, která nakonec zabrala
      (obrácená pointa proti case `zachrana-vytazena-vec-k-nicemu`), takže model
      má chuť z ní udělat celou větu místo vsuvky.
      DOKLAD KE STROPU (2026-08-02): referenční protokol testéra na tento vstup má
      **818 znaků / 5 vět** — a je to ÚSPORNÁ verze (jedna vsuvka, jedna závorka,
      žádné rozvíjení kulisy). Nad starým stropem 800, pod novým 900.
      POZOR — 818 je JEDNA generace, tedy 91 % nového stropu, a strop byl zvolen
      ex post z téhož vzorku. Case se proto vyhodnocuje jako MÍRA přes víc generací,
      ne z jednoho výstupu: **≥4 z 5 generací ≤900 znaků A 5 z 5 se závorkou
      i všemi následky**. Padne-li první podmínka a druhá drží, je upovídaný model;
      padne-li druhá, je těsný strop. Bez tohoto rozlišení se z casu nedá odvodit,
      jestli se má příště hýbat promptem, nebo číslem.
    zdroj: "obsah/situace.yaml privoz-celnik + veci.yaml + postihy.yaml ochrnuta-ruka (2026-08-02)"
