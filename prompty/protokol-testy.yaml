      (`duvod: stat_zrusen`) — žádný ze čtyř slotů tu stat „hodnota" nepoužívá,
      takže vstup teď nese „PRAVIDLO RUNU: —", stejně jako by to poslala hra.
      „Agent Malone" zůstává jako scénická reálie v textu SITUACE.
