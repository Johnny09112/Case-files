      VÝSLEDEK MECHANIKY: pásmo PRŮŠVIH 1/4
        MAX DOSAŽITELNÉ: 2/4
        Zamotat hlavu: selhání (práh 5; „Provaz a kladka" mělo improvizace 2)
        Přesunout z očí: selhání (práh 3; „Kněžský kolárek" mělo nástroj 0)
