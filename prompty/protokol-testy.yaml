  - id: invence-selhany-slot-nesedici-vec
    popis: >
      JÁDRO MANDÁTU (rule 4). Léčka agenta Malonea, PRŮŠVIH. Tři selhané sloty,
      v nichž věc k roli naprosto nesedí: petrolejová lampa na zapření totožnosti,
      mosazný boxer na klidnou tvář, řeznický hák je naopak SEDÍCÍ pojistka, na
      kterou nedošlo. Nález playtestu 2026-07-29 („lampa na opravu auta") byl přesně
      to, co režim bez mandátu produkuje: doslovné „zapřel totožnost s lampou
      v podpaží" bez obhajoby pokusu. Test: dostanou selhané sloty ZPŮSOB a ZÁMĚR?
      A zůstal řeznický hák (sedící, prošlý, nedošlo na něj) u konstatování?
