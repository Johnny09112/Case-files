# Fragmenty fallback protokolu (v3, D54(1) — 2026-07-30). Per-slot věty, které kód
# skládá do JEDNOHO odstavce pod pásmový odstavec z prompty/fallback-sablony.yaml.
# Řeší nález D54: plochý placeholder {veci} vyjmenuje čtyři kusy a mlčí o tom, KTERÁ
# věc byla v KTERÉ roli a jak dopadla. Fragment = jedna věta na jeden slot situace.
#
# NENÍ to prompt. Je to hotový text s dosazovanými hodnotami; bez API klíče na něm
# stojí celý zážitek {sólo, fallback}, takže jde o PRIMÁRNÍ texty, ne nouzovku.
#
# ------------------------------------------------------------------------------
# SCHÉMA (nová pole nepřidávat bez úpravy tohoto komentáře)
# ------------------------------------------------------------------------------
#   id:       kebab-case, unikátní NAPŘÍČ všemi soubory v obsah/ i prompty/.
#             Tvar: frag-<vysledek>-<stat|obecny>-<n>
#   vysledek: POVINNÉ. Přihrádka = PŘESNÁ hodnota `duvod` ze `slot_resolved`
#             (prototyp/src/engine/resolve.js — nevymýšlet, nepřejmenovávat):
#               proslo                   … slot uspěl (stat ≥ skrytý práh)
#               nizky_stat               … selhal, stat byl nízký (NEJČASTĚJŠÍ)
#               kombi_neuplny            … kombi slot (dva staty jedné věci) nevyhověl
#                                          v obou; KTERÝ ze dvou selhal, engine NELOGUJE
#                                          (resolve.js: `staty.every(v => v >= prah)`),
#                                          a mohly selhat i OBA → fragment nesmí tvrdit
#                                          „splnil polovinu“ ani „uměl tu snazší“
#               stat_zrusen              … pronásledovatel run-wide ruší tenhle stat
#               gangster_auto_fail       … štítek GANGSTER ve viditelné roli
#               postih_lock_stitek       … zámkový postih vlastníka, štítek se neuplatnil
#               postih_lock_viditelnost  … zámkový postih na viditelný/skrytý slot
#               neobsazeno               … slot nikdo neobsadil (složená postava
#                                          necommitovala) — karta ANI vlastník NEEXISTUJÍ
#   stat:     VOLITELNÉ. utok | obrana | hodnota | improvizace | nastroj.
#             Fragment se použije jen na slot s tímto statem. KOMBI SLOTY mají `stat`
#             jako pole dvou → stat-klíčovaný fragment na ně nikdy nesedne, proto má
#             KAŽDÁ přihrádka aspoň 2 obecné (bez `stat`) varianty jako pojistku.
#   text:     JEDNA věta, ukončená tečkou. Délka ~60–120 znaků ŠABLONY; po dosazení
#             naroste typicky o 20–30 znaků ({role} ~16, {vec} ~19), tvrdý strop je
#             150 znaků PO DOSAZENÍ. Jednotka je `String.length`, ne bajty.
#
# PLACEHOLDERY (dosazuje kód; nic jiného v textu být nesmí)
#   {vec}   název věci z obsah/veci.yaml, 1. PÁD, BEZ uvozovek. Engine NESKLOŇUJE →
#           fragment ho VŽDY obaluje českými uvozovkami a nadřazeným podstatným
#           jménem, které se skloní za něj. Nikdy do šikmého pádu — skloňuje se
#           obal (věc/věci/položka), ne placeholder.
#           POVOLENÉ OBALY VĚCI (revize 2026-08-02, viz REVIZE níže):
#             „věc „{vec}““ · „položka „{vec}““   — univerzální, POUŽÍVEJ TYTO DVA
#             „předmět vedený jako „{vec}““       — jen s úředním závěsem, max ~4× v sadě
#           „kus“ a HOLÝ „předmět“ jsou ZAKÁZANÉ: balík obsahuje NEPŘEDMĚTNÉ věci
#           („Slzy na povel“, „Zpěv opilce“, „Otrlený výraz“) a věc se do slotu
#           dostane i „špatně“ (to je pointa hry), takže stat slotu NEZARUČUJE
#           třídu karty. „kus „Zpěv opilce““ je vada v každém takovém renderu;
#           „předmět VEDENÝ JAKO „Zpěv opilce““ je pravda o evidenci — a nejlepší
#           dobový vtip sady (úřad zapsal pláč na povel jako inventární položku).
#   {role}  název role slotu z obsah/situace.yaml. Tvary jsou RŮZNÉ a fragment musí
#           sedět na všechny: infinitivní fráze („Zaplatit za vytažení“), JMENNÉ
#           výrazy („Silniční poplatek“, „Klidná tvář“, „Něco navíc“) i podmínkové
#           věty („Kdyby začal vyvádět“, „Nedýchat, když jde kolem“). Společné mají
#           jen velké počáteční písmeno a nesklonnost → role se NIKDY nestává
#           podmětem ani přísudkem věty, jen CITOVANÝM NÁZVEM položky.
#           OBALY ROLE: „úkol“ · „úkon“ · „bod“ · „kolonka“. „bod“ a „kolonka“
#           unesou i jmenné a podmínkové role nejlíp („bod „Kdyby přituhlo““),
#           proto patří do přihrádek, které padají na SKRYTÉ sloty (útok, zámky).
#           „položka“ je REZERVOVANÁ pro věci — pro roli se nepoužívá, jinak stojí
#           v jedné větě dvakrát a čtenář neví, co je co.
#           Test věty: dosaď „Zaplatit za vytažení“ i „Klidná tvář“ — musí projít obě.
#   {jmeno} PŘÍJMENÍ postavy (poslední slovo `jmeno` z obsah/postavy.yaml, kontrakt
#           prototyp/CLAUDE.md). Mužský rod, engine NESKLOŇUJE → výhradně nominativní
#           apozice v roli PODMĚTU: „podezřelý {jmeno}“. Žádný šikmý pád.
#           V přihrádce `neobsazeno` je {jmeno} i {vec} ZAKÁZANÝ — mechanika tam
#           neurčila ani osobu, ani věc.
#
# ------------------------------------------------------------------------------
# TVRDÁ PRAVIDLA (převzatá z hlavičky prompty/fallback-sablony.yaml — platí i zde)
# ------------------------------------------------------------------------------
# 1) NIC, CO MECHANIKA NEDALA. Fragment smí říct jen „tahle věc byla v téhle roli
#    a dopadlo to takhle“. Žádný následek, ztráta, postih, kredity ani Žár —
#    ty patří pásmové šabloně o odstavec výš. Rovněž ŽÁDNÁ PŘÍČINA selhání: práh je
#    kotva ± šum, takže slot propadne i věci, která na kotvu stačila. Fragment smí
#    popsat ZPŮSOB („povolil hned zkraje“), nikdy důvod („a nikoli náhodou“).
# 2) ŽÁDNÉ VÝHLEDOVÉ VAZBY („do dalšího úseku“, „potáhne se to“). Run může skončit
#    právě tímhle uzlem. (N5 sady šablon.)
# 3) NEUTRALITA K POČTU HRÁČŮ. Nepočítat osoby, žádné množné „podezřelí“ — mluví se
#    o ÚKOLU, VĚCI, VOZE. V sólu vede hráč jednu postavu a committne všechny čtyři
#    karty sám. (N3.)
# 4) TÓN: suchá úřední čeština 1930, evidenční registr („vedeno jako“, „k úkolu“,
#    „shledáno“). Humor VÝHRADNĚ z kontrastu úředního jazyka a absurdity toho, co se
#    stalo. Žádné vtipkování, zvolání, anachronismus, reálná značka ani osoba.
# 5) NEJVÝŠ JEDNA závorková poznámka vyšetřovatele na fragment, a jen výjimečně —
#    fragmenty se čtou po čtyřech za sebou, závorka v každé větě je tik.
#    V téhle sadě je záměrně JEDINÁ (frag-gangster-auto-fail-obecny-2).
# 6) `neobsazeno` NEPŘIPISUJE VINU VĚCI ani osobě — slot zůstal prázdný, žádná věc
#    tam nebyla, a nemohl ho obsadit ani hráč se složenou postavou. Jinak protokol
#    řekne opak toho, co o centimetr výš tvrdí razítko vysvětlující vrstvy („Slot
#    nikdo neobsadil — složená postava necommituje“). Čistá evidence, žádné hodnocení
#    prázdného místa. (N2.)
# 7) TYPOGRAFIE: uvnitř `text:` výhradně české uvozovky „ a “; ASCII " se v textu
#    NESMÍ objevit (na tom shořela v2 sada šablon — předčasně ukončený YAML scalar).
# 8) FRAGMENTY SE ČTOU HNED ZA SEBOU (čtyři věty, jedna za každý slot) a hned pod
#    pásmovým odstavcem. Proto: (a) každá věta musí obstát samostatně v řadě čtyř,
#    (b) NESMÍ opakovat, co říká pásmový odstavec (verdikt, počet zásahů, náklad,
#    název postihu), (c) varianty se musí lišit i STAVBOU věty, ne jen slovy.
#    Vazba „je veden s následkem“ je rezervovaná pásmu — zde se nepoužívá.
# 9) ÚŘEDNÍ ZÁVĚS „vedený / zapsaný jako“: NEJVÝŠ JEDEN NA VĚTU a CÍLOVĚ ~4 V CELÉ
#    SADĚ. Nález humor-testéra 2026-07-30: v odstavci ze čtyř vět jich bylo šest,
#    k tomu pásmo nese „v úseku vedeném jako {uzel}“ — z registrové kotvy se stal tik
#    (~45× za run). Druhý štítek ve větě proto nese HOLÁ vazba („věc „{vec}““).
#    ALE škrt na NULU je taky chyba (nález 2026-08-02): závěs nesl DRUHOU funkci —
#    je to HEDGE u nepředmětných karet. „předmět „Slzy na povel““ je nepravda,
#    „předmět vedený jako „Slzy na povel““ je pravda o evidenci. Proto se závěs
#    drží přesně tam, kde má obal riskovat („předmět“), a nikde jinde.
# 10) PŘIHRÁDKA `proslo` NESE, JAK TO DOPADLO, NE ŽE TO DOPADLO. Pásmový odstavec
#    o řádek výš už řekl „čtyři úlohy, čtyři zdařilé konce“; čtyři věty, z nichž
#    každá znovu hlásí úspěch („obstál“, „zdařilo se“, „vyhověl“), jsou refrén.
#    A „JAK“ tu znamená JAK TO ÚŘAD NEBO SCÉNA PŘIJAL(A) — nikdy co ta věc fyzicky
#    udělala: statický fragment sedí na VŠECHNY věci dané přihrádky, takže „páčidlo
#    vypáčilo vagon“ vyjde dřív nebo později na svatební dort. Fyzický způsob je
#    licence AI vrstvy, ne statického fragmentu.
#
# STAVBA VĚT (proč vypadají, jak vypadají): otvírák každé věty je vědomě rotovaný —
# k bodu / tlak na úkol / za úkol / u kolonky / věc první / fronted předmět
# („Důraz, který…“) / verdikt první („Nevyplněno — …“). Kolize se testovaly na
# situacích, kde spolu dva staty v jednom uzlu SKUTEČNĚ stojí (farmar-brod má
# všechny čtyři jednostatové role; rival-prepad má dva utok-sloty; mesto-houkacky
# dva improvizační). `neobsazeno` se ve složené partii vyskytne i 2–3× v jednom
# odstavci, proto jsou jeho tři varianty stavebně nejvzdálenější.
#
# ROTACE OBALŮ (druhá polovina téhož léku, revize 2026-08-02): odstavec dělá
# formulářem OPAKOVANÝ OBAL, ne slovní zásoba. Proto:
#   · varianty -1 a -2 TÉHOŽ statu mají RŮZNÝ obal věci (věc × položka) — uzel se
#     dvěma sloty téhož statu (rival-prepad, mesto-houkacky) tím rotuje sám;
#   · žádný obal nesmí přesáhnout ~50 % sady. Dnes: věc 17 · položka 18 ·
#     předmět (se závěsem) 4 · bez věci 3. Před revizí nesl jeden obal 69 %.
#
# TEST KOLIZE OBSAHOVÝCH SUBSTANTIV (levný, čtením po jedné větě se NENAJDE):
# vypiš z fragmentů obsahová substantiva a prožeň je proti poli `role` a `nazev`
# v obsah/*.yaml. Doložený nález 2026-08-02: „Nápor na úkon „Ustát nápor““
# (rival-prepad, obrana) — proto je ve fragmentu #3 „Tlak“. Táž třída chyby:
# obal „věc“ vedle adjektiva „věcná“ ve fragmentu lock_viditelnost.
#
# CÍLOVÝ POČET: 42 a to je STROP — opravy se dělají přepisem, ne přírůstkem (stejné
# pravidlo jako u sady šablon). Proč je strop VYŠŠÍ než u pásmových šablon (28):
# EXPOZICE. Pásmová vrstva losuje ~9× za run (jeden odstavec na uzel), fragmentová
# ~36× (čtyři sloty × devět uzlů) — čtyřnásobek při stejném autorském rozpočtu je
# zaručený refrén. Kód navíc preferuje nejméně použitý fragment přihrádky, takže se
# sada čerpá ROVNOMĚRNĚ a mělkost je vidět hned. Hloubka jde tam, kde je horko:
# `proslo` a `nizky_stat` mají po DVOU stat-klíčovaných variantách (13 + 13 = 26 ze
# 42), řídké přihrádky zůstávají na dvou až třech obecných.
#
# ------------------------------------------------------------------------------
# REVIZE 2026-08-02 — všech 42 textů přepsáno (id, přihrádky ani `stat` beze změny)
# ------------------------------------------------------------------------------
# DŮVOD: nález 3 z playtesty/2026-08-02.md — hráči hlásili, že fragmentový fallback
# má HORŠÍ ČEŠTINU než živý AI protokol („texty pro doplnění… kostrbaté“). Šlo
# o tři třídy vady, ne o jednotlivé věty:
#   1) OBAL „kus“ (27 ze 39 vět). Nefunguje na nepředmětné karty a v evidenční
#      češtině zní jako dobytek nebo slang. → věc / položka / předmět se závěsem.
#   2) NEPŘIROZENÝ SLOVOSLED. „Nabídnut byl k položce X kus…“, „ač předložen byl…“,
#      „Bez okolků vyřízena položka…“ — OVS inverze v každé druhé větě. Narovnáno
#      na S-V-O nebo frontovanou předložkovou frázi. ZÁMĚRNĚ ponechány TŘI dobové
#      kotvy („Nedostatečnost nutno přiznat“, „nabídku shledávám nízkou“, „nikoli
#      věcná“) + 4 úřední závěsy: bez nich sada přestane znít jako rok 1930.
#      Vrácení dalších inverzí NAVRHL humor-testér a bylo ODMÍTNUTO — nález u stolu
#      zněl doslova „kostrbaté“ a právě tyhle věty jsou nejpravděpodobnější příčina.
#      Rozhodne až druhé sezení; do té doby platí verze bez nich.
#   3) SÉMANTICKÉ VADY, které dvěma koly recenze prošly: „Obstarat položku měl
#      předmět“ (položku nelze obstarat), „Nápor na úkon „Ustát nápor““ (kolize se
#      jménem role), „Ke kolonce… zůstala prázdná“ (visící sloveso bez podmětu),
#      „Věc… nikoli věcná“ (kolize obalu s adjektivem).
# CO SE NEZMĚNILO: přihrádky, `stat`, počet 42, pravidla 1–10, jediná závorka
# v sadě (frag-gangster-auto-fail-obecny-2).

fragmenty:
  # ============================================================
  # PROSLO — slot uspěl (stat ≥ skrytý práh). 10 stat + 3 obecné.
  # Pravidlo 10: nese JAK to přijal úřad či scéna, ne že to prošlo.
  # ============================================================
  - id: frag-proslo-utok-1
    vysledek: proslo
    stat: utok
    text: "K bodu „{role}“ nastoupila věc „{vec}“; podruhé se o odpor nikdo nepokusil."

  - id: frag-proslo-utok-2
    vysledek: proslo
    stat: utok
    text: "Bod „{role}“ skončil dřív, než se stačil rozvinout; postarala se o to položka „{vec}“."

  - id: frag-proslo-obrana-1
    vysledek: proslo
    stat: obrana
    text: "Tlak na úkol „{role}“ zachytila položka „{vec}“ a nepovolila ani o píď."

  - id: frag-proslo-obrana-2
    vysledek: proslo
    stat: obrana
    text: "U kolonky „{role}“ stačilo, že věc „{vec}“ zůstala, kde byla."

  - id: frag-proslo-hodnota-1
    vysledek: proslo
    stat: hodnota
    text: "Za úkol „{role}“ byla vydána věc „{vec}“; přejímající si ji ani nepřepočítal."

  - id: frag-proslo-hodnota-2
    vysledek: proslo
    stat: hodnota
    text: "K úkonu „{role}“ byla přiložena položka „{vec}“ a víc už nikdo nežádal."

  - id: frag-proslo-improvizace-1
    vysledek: proslo
    stat: improvizace
    text: "K bodu „{role}“ byl předložen předmět vedený jako „{vec}“ s výkladem, který nikdo nezkoumal."

  - id: frag-proslo-improvizace-2
    vysledek: proslo
    stat: improvizace
    text: "Úkol „{role}“ vyřešila položka „{vec}“ způsobem, který se do formuláře nevejde."

  - id: frag-proslo-nastroj-1
    vysledek: proslo
    stat: nastroj
    text: "Věc „{vec}“ byla u bodu „{role}“ uznána za dostatečné vybavení a dál se o tom nejednalo."

  - id: frag-proslo-nastroj-2
    vysledek: proslo
    stat: nastroj
    text: "U úkolu „{role}“ odvedla položka „{vec}“ práci, ke které je určena, a nic nad ni."

  - id: frag-proslo-obecny-1
    vysledek: proslo
    text: "Věci „{vec}“ připadl úkol „{role}“ a při kontrole to nikomu nepřišlo divné."

  - id: frag-proslo-obecny-2
    vysledek: proslo
    text: "Námitky k úkolu „{role}“ nikdo nevznesl, přestože se k němu předložila položka „{vec}“."

  - id: frag-proslo-obecny-3
    vysledek: proslo
    text: "Bod „{role}“ byl vyřízen bez okolků; postarala se o to věc „{vec}“."

  # ============================================================
  # NIZKY_STAT — nejčastější selhání: věc byla přiřazena, stat nestačil.
  # 10 stat + 3 obecné. Nejvytíženější přihrádka celé sady.
  # Pravidlo 1: popisuje ZPŮSOB, nikdy PŘÍČINU (práh nese šum).
  # ============================================================
  - id: frag-nizky-stat-utok-1
    vysledek: nizky_stat
    stat: utok
    text: "Důraz, který se u bodu „{role}“ očekával, věc „{vec}“ nepřinesla."

  - id: frag-nizky-stat-utok-2
    vysledek: nizky_stat
    stat: utok
    text: "Do úkonu „{role}“ se položka „{vec}“ opřela zhurta, a přesto slabě."

  - id: frag-nizky-stat-obrana-1
    vysledek: nizky_stat
    stat: obrana
    text: "U úkolu „{role}“ měla vydržet položka „{vec}“; povolila hned zkraje."

  - id: frag-nizky-stat-obrana-2
    vysledek: nizky_stat
    stat: obrana
    text: "Věc „{vec}“ se u úkonu „{role}“ udržela jen do chvíle, kdy na tom začalo záležet."

  - id: frag-nizky-stat-hodnota-1
    vysledek: nizky_stat
    stat: hodnota
    text: "K úkolu „{role}“ byla nabídnuta věc „{vec}“; nabídku shledávám nízkou."

  - id: frag-nizky-stat-hodnota-2
    vysledek: nizky_stat
    stat: hodnota
    text: "Protistrana ocenila položku „{vec}“ u úkonu „{role}“ níž, než jak je vedena ve spisu."

  - id: frag-nizky-stat-improvizace-1
    vysledek: nizky_stat
    stat: improvizace
    text: "Výmluva postavená na položce „{vec}“ neobstála u úkolu „{role}“ ani na první pohled."

  - id: frag-nizky-stat-improvizace-2
    vysledek: nizky_stat
    stat: improvizace
    text: "U úkonu „{role}“ se z předmětu vedeného jako „{vec}“ nedalo vytlouct nic použitelného."

  - id: frag-nizky-stat-nastroj-1
    vysledek: nizky_stat
    stat: nastroj
    text: "Práci u úkolu „{role}“ měla zastat věc „{vec}“; na to byla krátká."

  - id: frag-nizky-stat-nastroj-2
    vysledek: nizky_stat
    stat: nastroj
    text: "Položka „{vec}“ byla k úkonu „{role}“ přinesena a tím její účast skončila."

  - id: frag-nizky-stat-obecny-1
    vysledek: nizky_stat
    text: "Spis k úkolu „{role}“ bez údivu konstatuje, že věc „{vec}“ zůstala za očekáváním."

  - id: frag-nizky-stat-obecny-2
    vysledek: nizky_stat
    text: "Předmět vedený jako „{vec}“ byl na úkol „{role}“ zjevně slabý a nikdo se tím netajil."

  - id: frag-nizky-stat-obecny-3
    vysledek: nizky_stat
    text: "Nedostatečnost nutno přiznat: k úkolu „{role}“ šla položka „{vec}“ a nepostačila."

  # ============================================================
  # KOMBI_NEUPLNY — slot žádal dva staty JEDNÉ věci a ta jim nedostála.
  # Engine NELOGUJE, který ze dvou selhal, a selhat mohly i OBA → žádné
  # „polovina“, „ta snazší“, „druhá chybí“. Jen obecné: kombi slot má
  # `stat` jako pole, stat-klíč na něj nesedne.
  # ============================================================
  - id: frag-kombi-neuplny-obecny-1
    vysledek: kombi_neuplny
    text: "Úkol „{role}“ žádal dvojí způsobilost naráz; věc „{vec}“ ji v celém rozsahu nenabídla."

  - id: frag-kombi-neuplny-obecny-2
    vysledek: kombi_neuplny
    text: "Položka „{vec}“ měla u úkolu „{role}“ vyhovět ve dvou ohledech naráz; nezvládla to."

  - id: frag-kombi-neuplny-obecny-3
    vysledek: kombi_neuplny
    text: "Úkon „{role}“ stál na dvou vlastnostech naráz; položka „{vec}“ je pohromadě neměla."

  # ============================================================
  # STAT_ZRUSEN — pronásledovatel run-wide ruší stat slotu; věc byla k ničemu.
  # Ruší se VLASTNOST, ne věc — proto text nikoho neobviňuje.
  # ============================================================
  - id: frag-stat-zrusen-obecny-1
    vysledek: stat_zrusen
    text: "K úkonu „{role}“ byla vedena věc „{vec}“; právě k té stránce se nepřihlíželo."

  - id: frag-stat-zrusen-obecny-2
    vysledek: stat_zrusen
    text: "Předmět vedený jako „{vec}“ přišel k úkolu „{role}“ se schopností, která tu neplatila."

  - id: frag-stat-zrusen-obecny-3
    vysledek: stat_zrusen
    text: "U úkonu „{role}“ byla rozhodná vlastnost vyřazena a položka „{vec}“ tím pozbyla smyslu."

  # ============================================================
  # GANGSTER_AUTO_FAIL — věc se štítkem GANGSTER ve viditelné roli.
  # Jediná závorková poznámka celé sady je zde (pravidlo 5).
  # ============================================================
  - id: frag-gangster-auto-fail-obecny-1
    vysledek: gangster_auto_fail
    text: "Do úkolu „{role}“, který se dělá na očích, šla věc „{vec}“; nenápadně se nenese."

  - id: frag-gangster-auto-fail-obecny-2
    vysledek: gangster_auto_fail
    text: "Položka „{vec}“ byla u úkolu „{role}“ spatřena dřív, než posloužila (což se dalo čekat)."

  - id: frag-gangster-auto-fail-obecny-3
    vysledek: gangster_auto_fail
    text: "K úkonu „{role}“ byla vytažena věc „{vec}“ a bylo po úkonu dřív, než začal."

  # ============================================================
  # NEOBSAZENO — slot nikdo neobsadil. {vec} ANI {jmeno} SE ZDE NESMÍ OBJEVIT
  # (pravidlo 6 / N2). Ve složené partii padne i 2–3× v jednom odstavci, proto
  # jsou varianty stavebně nejvzdálenější v celé sadě. Čistá evidence:
  # prázdný slot se NEHODNOTÍ — hodnotil by hráče, který nemohl commitnout.
  # ============================================================
  - id: frag-neobsazeno-obecny-1
    vysledek: neobsazeno
    text: "Úkol „{role}“ zůstal bez obsazení; ve spisu k němu není zapsáno nic."

  - id: frag-neobsazeno-obecny-2
    vysledek: neobsazeno
    text: "Ke kolonce „{role}“ neuvádí spis ani věc, ani osobu; místo zůstalo prázdné."

  - id: frag-neobsazeno-obecny-3
    vysledek: neobsazeno
    text: "Nevyplněno — u bodu „{role}“ nestál nikdo ani nic."

  # ============================================================
  # POSTIH_LOCK_STITEK — zámkový postih vlastníka, štítek věci se neuplatnil.
  # Osoba JE mechanicky určena (vlastník karty), proto smí padnout {jmeno};
  # druhá varianta je bezejmenná pojistka. Název postihu patří pásmu, ne sem.
  # ============================================================
  - id: frag-postih-lock-stitek-obecny-1
    vysledek: postih_lock_stitek
    text: "Podezřelý {jmeno} podléhá omezení, a věc „{vec}“ tak u úkolu „{role}“ nic nezmohla."

  - id: frag-postih-lock-stitek-obecny-2
    vysledek: postih_lock_stitek
    text: "Vlastnost, kterou se položka „{vec}“ vyznačuje, se u úkolu „{role}“ nesměla uplatnit."

  # ============================================================
  # POSTIH_LOCK_VIDITELNOST — zámkový postih na viditelný/skrytý slot.
  # Odlišuje se od `nizky_stat` tím, že překážka byla PŘEDPISOVÁ, ne věcná —
  # tuhle informaci nesou obě varianty, jinak přihrádka splyne.
  # ============================================================
  - id: frag-postih-lock-viditelnost-obecny-1
    vysledek: postih_lock_viditelnost
    text: "Podezřelý {jmeno} má úlohy toho druhu zapovězené; věc „{vec}“ u bodu „{role}“ nezasáhla."

  - id: frag-postih-lock-viditelnost-obecny-2
    vysledek: postih_lock_viditelnost
    text: "Položka „{vec}“ nebyla k bodu „{role}“ připuštěna; překážka byla předpisová, nikoli věcná."
