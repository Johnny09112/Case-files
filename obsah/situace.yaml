    svet: 1930
    telegraf: "Prám se odlepil od břehu a celník obchází náklad s nosem u plachty. Bedny se bez páky z dohledu nehnou a někdo se do toho musí dát dřív, než celník dojde na konec. Pod podlahou duní stroj a paluba je od stříkající vody klouzavá. Plachta sklouzne sama a pak jde o to, kdo se pohne dřív. Zbraň na očích tu všechno pokazí, potají může rozhodnout."
    text: >
