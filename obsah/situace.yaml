  - id: urednik-razitko
    nazev: Celnice v Albany
    typ: npc
    svet: 1930
    telegraf: "V celnici stojí fronta až ke dveřím a od vedlejší přepážky doléhá dopadání razítek. Nákladní list nese otisk, který v knize není, a dorazit ho bude muset někdo kusem korku. Úředník listuje pomalu a mračí se. V listině zůstane prázdné políčko a všimne si toho až on. Zbraň na očích tu jen popudí a potají nezmůže nic."
    text: >
