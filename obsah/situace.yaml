# Situace — resoluční uzly se 4 sloty. AUTORSKÝ text (AI nepíše, nerozhoduje).
# Tým committne přesně 4 karty naslepo dle telegrafu, po odhalení textu je rozdělí
# do 4 slotů co nejméně špatně. Každý slot: 1 stat vs. skrytý práh (kotva ± šum
# enginu). Viz prototyp-mvp.md §"Resoluční systém v3" a design-dokument §4.
#
# Schéma (nová pole nepřidávat bez úpravy komentáře):
#   id:        kebab-case, unikátní napříč obsah/
#   nazev:     krátký název místa v 1. PÁDĚ, začínající podstatným jménem. Dosazuje se
#              do protokolu jako {uzel} v obalech „v úseku vedeném jako {uzel}“ /
#              „v bodě hlášeném jako {uzel}“ — engine ho NESKLOŇUJE, takže musí snést
#              oba obaly beze změny tvaru. Bez něj by protokol sázel kebab-case id.
#   typ:       npc | lokace | zatah | lecka | konfrontace
#              (lecka/konfrontace se autorují u pronásledovatelů, ne zde)
#   svet:      1930 (default) | ...
#   telegraf:  předzvěst před commitem, max 400 ZNAKŮ (viz QA invariant níže)
#   text:      max ~5 vět; obsahuje přesně 4 mezery {VEC} + volně {kdo}.
#              Mezery {VEC} se plní názvy zahraných věcí V POŘADÍ slotů níže.
#   sloty:     přesně 4×:
#     - role:        krátký název role (co se v té mezeře děje)
#       stat:        1 z 5 statů | [stat, stat] = KOMBI (obě věci? ne — JEDNA věc,
#                    jejíž OBA uvedené staty musí být ≥ kotva; D19b, střídmě,
#                    nízká kotva 2–3 — 3 od kalibrace-1 2026-07-24)
#       kotva:       2–4 (práh 0 zakázán); engine přičte šum ±2 při odhalení
#                    (clamp do [0, stat-max]; ±1→±2 od kalibrace-2 2026-07-24)
#       viditelnost: viditelna | skryta   (ikona při odhalení)
#       stitek_citlivy: (volitelné VÝJIMKA) VELKÝMI — přebíjí parametr štítku pro
#                    tento slot (např. GANGSTER = eso i ve viditelné roli)
#   pasmove_vysledky:  situace autoruje JEN postih-pool per pásmo a případný loot.
#                      Kredity / Žár / ztráta nákladu jsou GLOBÁLNÍ dle pásma
#                      (prototyp-mvp.md) — situace je NEuvádí (D19, nález D3 kritika).
#     hladce_loot: { loot: karta }         # 4/4 — obsah lootu (karta = líznutí navíc)
#     # 3/4 HLADCE: bez postihu, nic se neautoruje
#     s_nasledky:  { postih_lehky: [<id>, ...] }   # 2/4 — engine vybere 1
#     prusvih:     { postih_tezky: [<id>, ...] }    # ≤1/4 — engine vybere 1
#   event:  (volitelné, jen část lokací) 3 flavor odbočky; engine losuje 1 ze 3.
#           SIM-INERTNÍ — čistá příchuť BEZ mechanického efektu (D19).
#
# QA INVARIANT TELEGRAFU — v3 (D51/D52, 2026-07-30). ÚPLNÉ ZNĚNÍ, ODŮVODNĚNÍ
# A HISTORIE PRŮCHODŮ: technika/telegraf-skrtaci-kolo-2026-07-30.md §2.
#
# Historie: „zmiň VŠECHNY VIDITELNÉ staty“ (do D47) → v2 „(A) POKRYTÍ: každý
# viditelný slot má nárok“ (D47–D49) → v3: POKRYTÍ ŠKRTNUTO. Důvod: první dohraný
# run u člověka (playtesty/2026-07-29) — „telegraf neříká nic a ještě víc mate“.
# Nebyla to vada exekuce D49, ale vada SPECIFIKACE: telegraf nesl PĚT položek,
# které si hráč držel v hlavě naráz, po jednom přečtení, před slepým commitem.
# Léčí se POČET POLOŽEK (5 → 3), NE délka — hráč sám řekl, že text smí být delší,
# takže uvolněné místo jde do OBRAZU (⌀ 317 zn., beze změny proti D49).
#
# Telegraf je PŘEDZVĚST, ne výčet rolí. Je to PRÓZA = lidský rendering signálu,
# který engine DERIVUJE ze slotů (`deriveTelegrafSignal`, prototyp/src/engine/
# resolve.js). Signál se NEautoruje — próza jen musí zůstat věrná: nesmí tvrdit
# nic, co signál vyvrací. Od D47/D50 je mechanický výčet („co z toho plyne“) v UI
# nativně SKRYTÝ (viditelný jen na 1. uzlu relace nebo se zapnutým ulehčením),
# takže v defaultním režimu je tenhle text JEDINÝ nositel informace před commitem.
# Informaci nese OBRAZ (překážka, člověk, předmět, gesto), ne jméno statu.
#
# --- JÁDRO: NÁROK JE SLOVESO, NE KULISA ---------------------------------------
# Scéna smí obsahovat cokoli — úředníka, který se dívá, zámek, blok pokut. Kulisa
# NIC neprozrazuje. Nárok vzniká teprve tím, že próza přiřkne POSÁDCE práci
# („bude třeba…“, „zbude…“). Z toho dvě pravidla:
#   (A) KOTVA    — právě JEDEN viditelný slot dostane nárok. Povinný.
#                  (v2 žádalo nárok pro KAŽDÝ viditelný slot — to je ŠKRTNUTO.)
#   (B) ČISTOTA  — próza nepřiřkne posádce žádný nárok, který není slotem.
#                  Po škrtu POKRYTÍ je to nejdražší pravidlo sady: falešná
#                  poptávka je chyba, kterou hráč nemá jak odhalit.
# Pořadí nároků je VOLNÉ — commit je naslepo, pořadí rolí je pro něj irelevantní.
#
# PRAVIDLO PODMĚTU (kontrola ČISTOTY, téměř grepovatelná): VĚT S PODMĚTEM POSÁDKA
# JE PŘESNĚ TOLIK, KOLIK JE NÁROKŮ (1, výjimečně 2). Ostatní věty mají podmětem
# SCÉNU a neobsahují „někdo / jiný / bude třeba / musí / zbude / jde to jedině“.
# DOVĚTEK: nárok vzniká i tehdy, když práci přiřkne NPC svým PŘÁNÍM („chce…“,
# „nedá, dokud…“) — takové věty se POČÍTAJÍ do nároků. Grep to nenajde.
#
# --- ZÁKAZ VÝHRADNOSTI (nejdražší pravidlo v3) --------------------------------
# VĚTA NÁROKU NESMÍ OBSAHOVAT OPERÁTOR VÝHRADNOSTI vztažený ke splnění scény:
# „jen“, „jedině“, „jinak“, „dokud ne…“, „nic jiného“, ani jeho disjunktivní
# formu („…, nebo se dál nepojede“).
#   ✗ „Ustoupí JEDINĚ tomu, kdo na ně vyjede zostra.“
#   ✓ „Zostra na ně vyjet bude muset někdo z posádky.“
# POVOLENÁ VÝJIMKA: výhradnost vztažená k NÁSTROJI té jedné práce („bez páky se
# nehnou“, „po dobrém nepovolí“) — tam se nic jiného nezapírá.
# PROČ TO VE V2 NEBYLO POTŘEBA: dokud próza jmenovala všechny poptávky, byla
# výhradnost neškodná ozdoba. Po škrtu POKRYTÍ mění ABSENCI nároku — která nemá
# znamenat NIC — na EXPLICITNÍ ZÁPOR o všech nepojmenovaných slotech. Je to
# anti-tell v gramatickém převleku nároku.
#
# --- SMĚROVÝ TEST (druhá polovina kontroly; bez něj to nefunguje) -------------
# Na KAŽDOU větu, ne jen na zápory: „Zvýší, nebo SNÍŽÍ tato věta ochotu stolu
# committnout kartu na stat X?“ Každé SNÍŽÍ u statu, který je v nějakém slotu
# (viditelném i skrytém), je porušení — bez ohledu na gramatickou formu.
# Výčet statů sám chytá jen zápory; tenhle test chytá i výhradnost a „NPC to
# nezajímá“ obraty. Doloženo: 4 z 19 uzlů prošly výčtem a směrovým testem ne.
#
# MARKÉR HRANICE NÁROKU:
#   KOMBI slot        = „a zároveň / a přitom“ v TÉŽE klauzuli.
#   dva různé sloty   = oddělené AKTÉREM nebo tečkou („Někdo… jiný…“),
#                       nikdy jen spojkou „a“.
#   jeden slot        = jedno sloveso, jeden objekt; druhý obraz se škrtá.
#
# --- ROZPOČET POLOŽEK (jádro v3) ----------------------------------------------
# POLOŽKA = jedna věc, kterou si hráč musí odnést z JEDNOHO přečtení:
#   (1) každý NÁROK (KOMBI slot = JEDNA položka, i když má dva požadavky)
#   (2) PŘEDZVĚST skrytých (počet + skrytá improvizace dohromady) = JEDNA
#   (3) VERDIKT ZBRANĚ včetně appendu = JEDNA
#   (4) PŘIPOMÍNKA `rusi` (jen lecka/konfrontace) = JEDNA
# CÍL 3 POLOŽKY, STROP 4. Záporné tvrzení se do položek NEPOČÍTÁ.
#
# DOVOLENÝ DRUHÝ NÁROK — co přestalo být povinné, zůstává dovolené:
#   · nejvýš JEDEN další viditelný slot;
#   · NIKDY tam, kde by tím byly pojmenované VŠECHNY viditelné STATY scény —
#     ne sloty, STATY (commit se dělá po statech). Odhalení musí zbýt aspoň jeden
#     NEPOJMENOVANÝ STAT, jinak přestane být odhalením;
#   · nejvýš u TŘETINY sady (dnes ≤ 6), s registrem id ve STAVU PŘEJÍMKY;
#   · v `lecka`/`konfrontace` jen tehdy, je-li kanál 7 ve SROSTLÉ FORMĚ.
#
# --- JAK SE VYBERE KOTVA (pořadí pravidel) ------------------------------------
# 1) Je-li ve scéně KOMBI slot, KOTVA je ON — je to jediný slot, který žádá JEDNU
#    věc dobrou ve DVOU statech; neohlášený dělá z commitu loterii.
# 1b) NENÍ-LI KOMBI a má-li scéna VIDITELNÝ ÚTOK-SLOT, u kterého zbraň na očích
#    PROJDE (`zbran_projde = ano`), je KOTVA TEN SLOT. Je to JEDINÉ místo ve hře,
#    kde je GANGSTER karta ve viditelné roli správná hra, verdikt o tom mlčí
#    (mluví jen o toleranci) a chybný commit v konfrontaci UKONČÍ RUN.
# 2) Jinak je KOTVA nárok, KTERÝ HRÁČ Z TYPU UZLU NEUHODNE (typ je na mapě):
#      lokace/zatah — nářadí a improvizace jsou ve viditelné trojici 5/5, peníze
#                     a klid 0/5 → informativní je útok, peníze, klid.
#      npc          — řeč 9/12, peníze 8/12, klid 8/12, ÚTOK jen 4/12 →
#                     informativní je ÚTOK, o to víc, že u npc zbraň na očích
#                     propadá, takže „zatlačit“ je pobídka i past zároveň.
#    KRITÉRIEM JE INFORMAČNÍ HODNOTA, NE SPLNITELNOST: viditelný útok-slot u npc
#    obslouží ~4 karty ze 40, a telegraf ho přesto jmenuje — hráčovým úkolem je
#    ROZHODNOUT, ne dostat splnitelný úkol. Je to přiznaná SÁZKA.
# 3) Nedá-li 2 odpověď, vyhrává nárok, který dává scéně jméno nebo je fyzicky
#    nevyhnutelný. U `zatah`/`lecka`/`konfrontace` je pravidlo 3 PRIMÁRNÍ (po 1
#    a 1b): tam hráč typ místa před commitem nikde nevidí (vkládají se z prahů
#    Žáru), takže odchylku od prioru není z čeho poznat.
# 4) ZÁKAZ: kotva se NEVYBÍRÁ podle výšky kotvy slotu — z čitelnosti by se stala
#    obtížnostní páka (zakázáno D47 §13.2). Je to zákaz KRITÉRIA, ne tvrzení
#    o ortogonalitě k obtížnosti: naměřeno, že pravidlo 1 vybírá v obou KOMBI
#    scénách nejnižší kotvu scény.
#
# --- ZÁPORNÉ TVRZENÍ (po škrtu POKRYTÍ cennější než dřív) ---------------------
# Stat se smí výslovně VYLOUČIT („peníze si vzít netroufne“) — ale JEN stat, který
# není v žádném slotu, ani skrytém, a nejvýš jednou za telegraf (dva jen v JEDNÉ
# klauzuli: „nechce zaplaceno ani se s nikým bít“).
# POVINNÝ ZÁPOR: je-li `zbran_projde = ano` A ÚTOK není v žádném slotu, MUSÍ
# telegraf útok výslovně vyloučit („a bít se tu nebude s kým“). Dopadá na 3 z 19.
# Bez toho zní verdikt „Zbraň tu nikdo neřeší“ jako POBÍDKA ve scéně, kde
# útok-slot vůbec není. Je to jediná mitigace přiznané ceny škrtu, která nestojí
# ani jednu položku.
# STROP: zápor o TÉMŽE statu nejvýš 3× v sadě (jen VOLITELNÉ; povinné a `rusi`
# se nepočítají) — jinak sada učí „hodnota je past“, ač je nárokem v 8 slotech.
# JAK SE KONTROLUJE: NEČTI větu a neptej se „je to zápor?“. Vypiš VŠECH PĚT statů
# uzlu, odškrtni, které jsou v nějakém slotu, a teprve pak hledej, o kterém próza
# tvrdí, že nepomůže. POZOR NA `improvizace` — všechny nalezené anti-telly mířily
# na ni (je to jediný stat s NEPŘEDMĚTNOU poptávkou, takže se vylučuje nejsnáz).
# ANTI-TELL JE HORŠÍ NEŽ MLČENÍ: mlčení neinformuje, anti-tell aktivně odvádí.
#
# --- KANÁLY: CO PRÓZA NESE A CO VĚDOMĚ NENESE ---------------------------------
# Engine derivuje ŠEST kanálů, próza od v3 nese jen PODMNOŽINU: z `trend` jen
# JEDEN slot (kotvu). Próza tedy říká MÉNĚ než signál — VĚDOMÁ ODCHYLKA ve
# prospěch čitelnosti, NE drift, a nesmí se „opravovat“ doplněním nároků. Kdo
# bude chtít POKRYTÍ vrátit (potřetí), musí nejdřív vrátit viditelnost
# mechanického řádku (D47/D50).
# 1) KOTVA — pravidlo (A). Obraz je předmět, člověk nebo gesto, nikdy abstrakce.
# 2) KOMBI SLOT (`stat: [a, b]`) — je vždy kotvou a nese se jako JEDEN nárok se
#    dvěma požadavky v JEDNÉ práci („přibít a zároveň podložit něčím po ruce“).
# 3+4) PŘEDZVĚST — JEDNA věta, že se něco pokazí, nesená PŘEDMĚTEM Z TÉHLE SCÉNY
#    (vidle, lucerna, ručička váhy, štěrk), nikdy abstraktní „věc“. Je vždy
#    NEOSOBNÍ: podmětem je scéna, ne posádka, a markéry nároku se v ní nepoužívají.
#    ČÍSLOVKA JEN TAM, KDE `proti_srsti` ≠ 1 (v sadě jediné `nadrazi-noc`) —
#    počet „jedna“ je konstanta u 18 z 19, kterou hráč zná po druhém uzlu, a
#    vyčíslovat ji znamená platit skeletonem za nulu: přesně tenhle požadavek
#    vyrobil v D49 skeleton „Jedna věc se rozhodne bez vás…“ v 17 z 19 telegrafů.
#    `zbran_skryte` SE V PŘEDZVĚSTI NEOPAKUJE — buňky B a C verdiktu ho nesou
#    doslova, takže by to bylo dvojí kódování konstanty u 10 z 19. Smí ho nést
#    obrazem, nemusí. `improv_skryte` POVINNÝ ZŮSTÁVÁ: v žádném verdiktu není
#    a v celé sadě ho nese jediný uzel (`nadrazi-vypravci`).
#    O statu jiného skrytého slotu se MLČÍ (D47/R1) — ani kladně, ani záporně.
# 5) VERDIKT ZBRANĚ — jedna věta, POSLEDNÍ. Mluví VÝHRADNĚ o toleranci místa,
#    nikdy o tom, jestli se zbraň hodí. Zdroj pravdy obsah/stitky.yaml
#    `chovani_dle_typu`, ne typ uzlu odhadem.
#    ZNĚNÍ JE NORMATIVNÍ, NE PŘÍKLADNÉ — cituje se DOSLOVNĚ. (Pravidlo „slovesa
#    se smějí přizpůsobit, smysl ne“ v praxi NEDRŽELO: vyrobilo 11 znění na
#    4 buňky, s největším rozptylem u dvou buněk, které se liší jen tím, jestli
#    skrytá zbraň pomáhá — posluchač je rozlišoval na POSLEDNÍCH TŘECH SLOVECH
#    dvou téměř identických vět. To je auto-fail karty za přeslechnutí.)
#    PARADIGMA: pevný rám „Zbraň … na očích …, potají …“, variabilní je KONEC.
#      zbran_projde=ano,        zbran_skryte=false → „Zbraň tu nikdo neřeší,
#                                                    ani na očích.“
#      zbran_projde=ano,        zbran_skryte=true  → „Zbraň tu nikdo neřeší
#                                                    a potají se vyplatí.“
#      zbran_projde=jen_skryte, zbran_skryte=true  → „Zbraň na očích tu všechno
#                                                    pokazí, potají může rozhodnout.“
#      zbran_projde=jen_skryte, zbran_skryte=false → „Zbraň na očích tu jen popudí
#                                                    a potají nezmůže nic.“
#    LEXIKÁLNÍ REGISTR JE JEDNOTNÝ: vždy „zbraň“ (ne bouchačka/železo) a vždy osa
#    „na očích / potají“. Ať ta věta zní jako DORAŽENÁ KLAUZULE TELEGRAMU — po
#    druhém uzlu ji stůl čte jako razítko a smí ji přeslechnout bez ztráty obsahu.
#    KOMPENZACE ZA TU PEVNOST PATŘÍ O VĚTU DŘÍV: rozvolni POZICI PŘEDZVĚSTI.
#    VE V3 SE TENTO KANÁL NESMÍ ZATMAVIT ANI O SLOVO — po škrtu POKRYTÍ už absence
#    útok-nároku NEZNAMENÁ, že se tu nebije, takže inferenci „bouchačku necháme
#    doma“ nese jen verdikt a případný zápor. Bot ho navíc čte s JISTOTOU.
# 6) SLOTOVÁ VÝJIMKA (`stitek_citlivy: GANGSTER`) — append ZA verdikt, vázaný na
#    NÁROK KOTVY, ne na osobu (jinak nemá rozlišovač scope a stůl to čte jako
#    ODVOLÁNÍ verdiktu): „— ale na tohohle chlapa zabere i zatlačit s ní nahlas.“
#    Spojka je ADITIVNÍ („i“), nikdy exkluzivní. Není-li `stitek_citlivy` slot
#    zároveň KOTVOU, je to nález a řeší se výběrem kotvy, ne appendem.
# 7) JEN V `lecka`/`konfrontace`: PŘIPOMÍNKA PRAVIDLA `rusi` pronásledovatele
#    („peníze na něj neplatí“ / „u Brodyho přitáhne dvojnásob pozornosti“).
#    NENÍ to sedmý derivovaný kanál — pravidlo je run-wide a viditelné od startu.
#    Formuluje se fikcí, nikdy zněním pravidla; Brodyho pravidlo je o POZORNOSTI
#    (Žár za GANGSTER karty, i ve skrytém slotu), ne o výstřelech a olovu.
#
# --- CO SE NESMÍ PROZRADIT ----------------------------------------------------
# Kotvy, prahy, šum, konkrétní čísla, pásma, obsah lootu ani stat skrytého slotu
# nad rámec kanálu 4. Telegraf říká, CO se blíží, nikdy JAK TĚŽKÉ to je.
#
# --- ZÁKAZ META-SLOVNÍKU (autorský checklist, ne CI test) ----------------------
# NESMÍ se objevit: „role“, „slot“, „viditeln*“, „skryt*“, „stat“, „práh“,
# „kotva“, jména statů (útok / obrana / hodnota / improvizace / nástroj ani
# synonyma „nářadí“, „důvtip“, „šikovné ruce“) a číslovky ve spojení s rolemi.
# Výjimka: „na očích“ / „potají“ ve verdiktu zbraně. (Grep chytí tohle, ale
# drahá porušení — falešná poptávka, leak skrytého slotu — grepem NEjdou.)
#
# --- SLOVNÍK NÁROKŮ (klíčem je SLOVESO; jsou to DEFINICE, NE ZNĚNÍ) -----------
# POZOR: příklady níže definují, co který nárok JE. Nejsou to doporučené formulace.
# První obsahové kolo je použilo jako frázovník („vymyslíte až na místě“ 10×) —
# proto STROP: žádná fráze ze slovníku se v sadě neopakuje víc než 2×.
#   utok         posádka musí TLAČIT: prorazit, zvýšit hlas, být rychlejší,
#                postavit se. Obraz zbraně jen tam, kde je zbran_projde=ano.
#   obrana       posádka musí VYDRŽET a nedat znát. POZOR: NPC, který se dívá,
#                sám o sobě obranu NEobsazuje — obsadí ji až demand posádce.
#   hodnota      posádka musí DÁT něco, co má cenu.
#   improvizace  NEEXISTUJE správná věc: musí to jen OBSTÁT.
#   nastroj      SPRÁVNÁ věc existuje a musí se správně použít.
#   Kolize: utok × obrana = kdo jedná první (tlačí vs. drží nápor) · nastroj ×
#   improvizace = existuje ve scéně věc, která to řeší? · hodnota × improvizace =
#   dostane protistrana VĚC, nebo jen slova? ZBYTEK DISJUNKTNÍ NEBUDE: NPC jako
#   kulisa je v pašerácké scéně nevyhnutelné a čtenář si ho může přečíst jako
#   poptávku po obraně. Invariant to nezakazuje a NEPŘEDSTÍRÁ, že to vyřešil.
#
# --- HUMOR (dělicí čára proti protokolu) --------------------------------------
# Smí plynout ze SUCHÉHO POJMENOVÁNÍ hrozivé věci („parta nadšených občanů“,
# „úředník s předpisem na všechno“). NESMÍ ze srovnání, pomlčkové pointy ani
# komentáře k NPC — to je motor protokolu a každý takový vtip v telegrafu je
# smích, který protokol už nevydělá.
#
# --- KAM SMÍ TÉCT UVOLNĚNÉ MÍSTO ----------------------------------------------
# Do věty NÁROKU a do PŘEDZVĚSTI. NE do úvodní expozice scény: tu hráč dostane
# ještě dvakrát (pole `text` a PRVNÍ VĚTA PROTOKOLU). Rozvine-li telegraf scénu
# na dvě věty, protokol má o jednu větu pointy míň.
#
# --- HUMOR (dělicí čára proti protokolu) --------------------------------------
# Smí plynout ze SUCHÉHO POJMENOVÁNÍ hrozivé věci („parta nadšených občanů“,
# „úředník s předpisem na všechno“). NESMÍ ze srovnání, pomlčkové pointy ani
# komentáře k NPC — to je motor protokolu.
# OPERAČNÍ TEST: ŠKRTNI DRUHOU POLOVINU VĚTY. Přežije-li obraz sám a pořád hrozí,
# byl ten ocásek narátorova poznámka a patří do protokolu. Zakázán je hodnotící
# PREDIKÁT nad obrazem („tři chlapi, kteří se nebaví“); dovolena je hodnotící
# JMENNÁ FRÁZE („parta nadšených občanů“) — ironie je uvnitř substantiva.
#
# --- ROZSAH, JEDNOTKA A TEMPO -------------------------------------------------
# 3–5 vět, STROP 400 znaků (D48), CÍL ~320 (D51) — a ten cíl je STŘED PÁSMA
# 300–360, NE pokyn ke krácení. Nejvýš DVĚ věty bez položky.
# JEDNOTKA = ZNAKY: `String.length` v JS nad naparsovaným řetězcem, bez
# accent-foldu. NE bajty (diakritika je dvoubajtová, nadhodnotí to o ~10 %).
# Rozpočet na UZEL: telegraf + `text` ≤ 670 ZDROJOVÝCH znaků (tj. `text`
# s nedosazenými `{VEC}`/`{kdo}`; po dosazení naroste o ~25 %, to je v tom stropu
# započítané). Telegraf je scéna PŘEDEM: neosobně, v přítomném čase, nikdy
# nepředjímá výsledek. `text` je táž scéna POTOM: v minulém čase a se jmény.
# KAŽDÝ TELEGRAF SE MĚŘÍ, NEODHADUJE — a měří ho někdo, kdo umí spustit kód
# (dvakrát se to spletlo o 30–50 znaků a jednou z toho byl spor o jednotku).
#
# --- PŘEJÍMKA v3 (7 bodů, per telegraf; nahrazuje proceduru D49) --------------
#   1) KOTVA je právě jeden viditelný slot, vybraná dle pořadí 1 → 1b → 2 → 3.
#   2) ČISTOTA přes PRAVIDLO PODMĚTU — a každý nárok se čte PROTI POLI `text`
#      téhož uzlu, ne proti jménu role (jméno role je zkratka; `text` říká, co se
#      v tom slotu doopravdy dělá).
#   3) PŘEDZVĚST nese předmět ze scény + `improv_skryte`, je-li true; číslovku
#      jen tam, kde `proti_srsti` ≠ 1.
#   4) VERDIKT je DOSLOVNĚ jeden ze čtyř řetězců + pevný append. Kontroluje se
#      ZNĚNÍ, ne smysl: sestav tabulku buňka → uzel → znění a spočítej RŮZNÁ
#      znění na buňku. Musí být 1. (Rozpad na 11 znění se čtením po jednom
#      telegrafu NENAJDE.)
#   5) POVINNÝ ZÁPOR tam, kde `zbran_projde = ano` a útok není v žádném slotu;
#      u `lecka`/`konfrontace` navíc kanál 7 ve srostlé formě.
#   6) ŽÁDNÝ ANTI-TELL — kontrola VÝČTEM pěti statů, ne čtením.
#   7) SMĚROVÝ TEST NA KAŽDOU VĚTU + ZÁKAZ VÝHRADNOSTI. Bod 6 sám NESTAČÍ:
#      výhradnost je gramaticky NÁROK a výčtem projde.
#
# --- STAV PŘEJÍMKY (v3, D51 + D52, 2026-07-30) --------------------------------
# Znění invariantu i sada 19 telegrafů jsou zapečeny po řetězci: generátor →
# design-critic NA SPECIFIKACI (dřív než na texty) → protocol-humor-tester na sadě
# → opravné kolo → dokončovací kolo → re-review obou → MECHANICKÁ APLIKACE
# směrového testu (2 průchody: 15/19, po cílené opravě 4 vět 19/19) → délky
# změřené kódem. Sada se třikrát NEZAPEKLA, protože ji držel předregistrovaný gate
# ČISTOTY; historie a citace viz report.
# DÉLKY (znaky): min ~284 · max ~351 · průměr ~317. Strop 400 i rozpočet uzlu 670
# splněny 19/19.
# REGISTR DRUHÉHO NÁROKU (3 z 19): deputy-mytnice · agent-malone/konfrontace ·
# serif-brody/lecka.
# ZAKRÝVACÍ ZKOUŠKA JE POŘÁD OTEVŘENÁ POLOŽKA (od D49) — protokol viz
# technika/telegraf-invariant-navrh-2026-07-29.md §13; po v3 se zjednodušuje
# (ptá se na jednu poptávku, ne na tři).
#
# Cílový počet pro MVP: 7 témat × 2 varianty = 14 + 1 speciální Zátah.

situace:
  # ============================================================
  # TÉMA 1 — Farmář
  # ============================================================
  - id: farmar-brod
    nazev: Farmářův brod
    typ: npc
    svet: 1930
    telegraf: "Vůz sedí v brodě po nápravy a na břehu už čeká farmář s vidlemi. Postraňky jsou zpuchřelé; někdo je bude muset sešít, než koně vůz vytrhnou. Proud pod koly přerovnává kameny. Ty vidle se zvednou bez ohlášení a dál to bude o rychlosti. Zbraň na očích tu všechno pokazí, potají může rozhodnout."
    text: >
      Kola zapadla doprostřed brodu a na břehu už čeká farmář s vidlemi. {kdo} mu
      nabídl {VEC} za vytažení, {kdo} držel hlas mírný pomocí {VEC} a {kdo} zapřáhl
      koně s {VEC}. Kdyby chlap začal vyvádět, měl {kdo} po ruce {VEC}.
    sloty:
      - { role: "Zaplatit za vytažení", stat: hodnota, kotva: 4, viditelnost: viditelna }
      - { role: "Nezvednout hlas",      stat: obrana,  kotva: 3, viditelnost: viditelna }
      - { role: "Zapřáhnout a táhnout", stat: nastroj, kotva: 3, viditelnost: viditelna }
      - { role: "Kdyby začal vyvádět",  stat: utok,    kotva: 3, viditelnost: skryta }
    pasmove_vysledky:
      hladce_loot: { loot: karta }
      s_nasledky:  { postih_lehky: [drobna-pokuta, vysypana-bedna, roztresene-ruce] }
      prusvih:     { postih_tezky: [zlomene-zebro] }

  - id: farmar-stodola
    nazev: Statkářova stodola
    typ: lokace
    svet: 1930
    telegraf: "Statkář za nocleh nechce ani dolar a bít se tu nebude s kým. U vrat leží jeho smečka a nespí; seno za nimi je vlhké až k trámům. Vrata bude muset někdo zaklínit a zároveň podepřít tím, co leží po ruce. Lucerna projde kolem stání jedinkrát a mimo její světlo se stodola nedá přečíst. Zbraň tu nikdo neřeší, ani na očích."
    text: >
      Ve stodole to páchne senem a psi u vrat nespí. {kdo} tišil smečku pomocí
      {VEC}, {kdo} zaklínil vrata {VEC} a {kdo} zahrabal bednu do sena s {VEC}.
      Když statkář obcházel s lucernou, {kdo} ani nedýchal za {VEC}.
    sloty:
      - { role: "Utišit psy",            stat: improvizace,           kotva: 4, viditelnost: viditelna }
      - { role: "Zaklínit vrata",        stat: [nastroj, improvizace], kotva: 3, viditelnost: viditelna }
      - { role: "Schovat bednu do sena", stat: nastroj,               kotva: 4, viditelnost: viditelna }
      - { role: "Nedýchat, když jde kolem", stat: obrana,             kotva: 2, viditelnost: skryta }
    event:
      - "Ve vedlejším stání funí prasata a pod korytem leží zapomenutá bedna cizí kořalky."
      - "Statkářova dcera vás z okna pozoruje, ale mlčí — zatím."
      - "Na trámu visí puška po dědovi. Nabitá."
    pasmove_vysledky:
      hladce_loot: { loot: karta }
      s_nasledky:  { postih_lehky: [prach-do-oci, mlha-v-hlave, nervy-v-hajzlu] }
      prusvih:     { postih_tezky: [rozdrcena-noha] }

  # ============================================================
  # TÉMA 2 — Venkovský strážník
  # ============================================================
  - id: deputy-mytnice
    nazev: Mýtnice za Batavií
    typ: npc
    svet: 1930
    telegraf: "U mýtné boudy natahuje zástupce šerifa ruku po silničním poplatku a sazbu si určuje sám; vysolit ji bude muset někdo z posádky. Jiný zatím odvede řeč k pumpě, která na dvoře netočí ani kapku. Ruka mu sjede z bloku pokut níž a bude to o pěstech. Zbraň na očích tu všechno pokazí, potají může rozhodnout."
    text: >
      Zpoza závory vystoupil zástupce šerifa a poklepal na blok pokut. {kdo} mu
      vtiskl do dlaně {VEC}, {kdo} odvedl řeč stranou pomocí {VEC} a {kdo} u toho
      držel kamennou tvář za {VEC}. Kdyby přituhlo, čekala pod plachtou {VEC}.
    sloty:
      - { role: "Silniční poplatek",  stat: hodnota,     kotva: 3, viditelnost: viditelna }
      - { role: "Zamluvit to",        stat: improvizace, kotva: 4, viditelnost: viditelna }
      - { role: "Klidná tvář",        stat: obrana,      kotva: 2, viditelnost: viditelna }
      - { role: "Kdyby přituhlo",     stat: utok,        kotva: 3, viditelnost: skryta }
    pasmove_vysledky:
      hladce_loot: { loot: karta }
      s_nasledky:  { postih_lehky: [drobna-pokuta, vysypana-bedna, nervy-v-hajzlu] }
      prusvih:     { postih_tezky: [zlomene-zebro] }

  - id: deputy-hlidka
    nazev: Hlídka na senecké silnici
    typ: npc
    svet: 1930
    telegraf: "Postarší strážník stojí vozem napříč silnicí a leští si odznak. Na zadním kole se cestou uvolnily matice a někdo je bude muset dotáhnout. Strážník si zatím prohlíží tabulku vozu, číslo po číslo. Odznak dopadne zpátky na kapsu dřív, než kdo domluví. Zbraň na očích tu všechno pokazí, potají může rozhodnout."
    text: >
      Strážník postavil vůz napříč a založil ruce. {kdo} udržel nervy na uzdě za
      {VEC}, {kdo} mu strčil něco na přilepšenou v podobě {VEC} a {kdo} spravil,
      co bylo třeba, s {VEC}. Kdyby vytáhl bouchačku první, měl {kdo} po ruce {VEC}.
    sloty:
      - { role: "Nedat na sobě znát", stat: obrana,  kotva: 4, viditelnost: viditelna }
      - { role: "Na přilepšenou",     stat: hodnota, kotva: 3, viditelnost: viditelna }
      - { role: "Spravit, co třeba",  stat: nastroj, kotva: 3, viditelnost: viditelna }
      - { role: "Kdyby tasil první",  stat: utok,    kotva: 3, viditelnost: skryta }
    pasmove_vysledky:
