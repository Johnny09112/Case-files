    nazev: Starý most přes Mohawk
    typ: lokace
    svet: 1930
    telegraf: "Příjezd na most přes Mohawk drží zrezivělá závora, kterou roky nikdo nezvedl, a bít se tu nebude s kým. Prkna za ní jsou prohnilá: bude je třeba přibít a zároveň podložit něčím, co leží po ruce. Uprostřed zeje díra a pod ní jde řeka. Jedno prkno povolí, až bude pozdě couvnout. Zbraň tu nikdo neřeší, ani na očích."
    text: >
      Před vozem se táhl most jak vytlučené zuby. {kdo} zvedal závoru {VEC}, {kdo}
      zpevňoval prkna {VEC} a {kdo} navedl kola přes díru s {VEC}. A {kdo} se
      snažil nedat na sobě znát, jak tenký led to je, pomocí {VEC}.
    sloty:
